# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8087

# ==========================================
# MYSQL DATABASE CONFIGURATION
# ==========================================
# Keep your existing database URL and credentials.
spring.datasource.url=jdbc:mysql://localhost:3306/smart_traffic_ambulance
spring.datasource.username=root
spring.datasource.password=2125
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / HIBERNATE CONFIGURATION
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# GPS SIMULATION CONFIGURATION
# ==========================================
# Ambulance simulation speed in km/h
ambulance.simulation.speed-kmh=40

# Update ambulance location every 5 seconds
ambulance.simulation.interval=5000

# Simulated starting location for demonstrations.
# These coordinates are used only when the ambulance
# is already at its destination.
ambulance.simulation.start-latitude=12.949670
ambulance.simulation.start-longitude=77.639373

# ==========================================
# OSRM ROUTING CONFIGURATION
# ==========================================
# Public OSRM routing service is configured in RoutingService.java.
# No additional property is required by the current implementation.

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging.level.com.smarttraffic.ambulance=INFO
logging.level.org.springframework.web=INFO

